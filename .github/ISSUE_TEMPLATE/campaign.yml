name: キャンペーンを登録
description: 見つけた懸賞・ポイ活キャンペーンのURLを貼ると、締切を読み取って下書きを返します
title: "[登録] "
body:
  - type: markdown
    attributes:
      value: |
        公式ページのURLと種類だけでも登録できます。空の欄はページから自動で読み取ります。
        下書きがコメントで返ってくるので、確認して **公開** とコメントすると掲載されます。
  - type: input
    id: url
    attributes:
      label: 公式ページのURL
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 種類
      options:
        - 懸賞
        - ポイ活
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: ひとこと紹介（自分の言葉で）
      description: |
        140字まで。「手間」「当たりやすさ・お得さ」「注意点」から1〜2つを、自分で確かめた事実で書く。
        懸賞の例：フォローとリポストだけで応募完了。当選50名と多めなので気軽に。
        ポイ活の例：5,000円の買い物で上限に届く。エントリーは明日まで、買い物は月末までOK。
        NG：公式の文章の丸写し／「必ず当たる」「絶対お得」などの言い切り
      placeholder: 例）レシートを撮って送るだけ。対象商品を1つ買う予定がある人向け。
  - type: input
    id: name
    attributes:
      label: キャンペーン名（空ならページから自動）
  - type: input
    id: deadline
    attributes:
      label: 締切（空なら自動で読み取り）
      placeholder: 2026-11-30 23:59
  - type: input
    id: prize
    attributes:
      label: 賞品・還元内容（空なら自動で候補）
      placeholder: ギフト券1万円 / 10%還元（上限2,000ポイント）
  - type: input
    id: conditions
    attributes:
      label: 応募・参加の条件（空なら自動で候補）
      placeholder: Xでフォロー＆リポスト、要エントリー
  - type: input
    id: affiliate
    attributes:
      label: アフィリエイトリンク（任意）
      description: 入れたものには自動で「PR」表記が付きます
